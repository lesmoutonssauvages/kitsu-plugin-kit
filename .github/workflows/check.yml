name: Check

on:
  workflow_call:

jobs:
  check:
    name: Lint, type-check, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Smoke-test package exports
        run: npm run smoke
