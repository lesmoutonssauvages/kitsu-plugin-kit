name: Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  publish:
    name: Publish to npm
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1 (OIDC + provenance).
      - name: Ensure recent npm CLI
        run: npm install -g npm@latest

      - run: npm ci

      - run: npm run build

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node --input-type=commonjs -e "console.log(require('./package.json').version)")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Git tag '$GITHUB_REF_NAME' does not match package.json version '$VERSION'."
            echo "Bump version in package.json, then tag v$VERSION."
            exit 1
          fi

      # OIDC trusted publishing is preferred (no token).
      # NODE_AUTH_TOKEN is only a bootstrap fallback for the first publish,
      # while the package does not yet exist on npm.
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
