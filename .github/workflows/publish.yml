name: Publish

on:
  push:
    tags:
      # Semver without a "v" prefix: 0.0.1, 1.2.3, 1.2.3-beta.1
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  publish:
    name: Stage on npm
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing: npm >= 11.5.1. Staged publishing: npm >= 11.15.0.
      - name: Ensure recent npm CLI
        run: npm install -g npm@latest

      - run: npm ci

      - run: npm run build

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(node --input-type=commonjs -e "console.log(require('./package.json').version)")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Git tag '$TAG' does not match package.json version '$VERSION'."
            echo "Bump version in package.json, then tag $VERSION (no v prefix)."
            exit 1
          fi

      # OIDC only. The trusted publisher must allow `npm stage publish` and
      # must NOT allow `npm publish`. A maintainer then 2FA-approves the stage.
      - name: Stage package on npm
        run: npm stage publish --access public
